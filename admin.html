<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWD Autoworld - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-gray-100 font-sans min-h-screen">

    <!-- 登录弹窗 -->
    <div id="login-modal" class="fixed inset-0 z-50 bg-black/90 flex items-center justify-center p-4">
        <div class="bg-slate-800 p-8 rounded-2xl border border-gray-700 max-w-md w-full shadow-2xl space-y-6">
            <div class="text-center">
                <div class="bg-amber-500 text-slate-900 font-extrabold text-2xl px-3 py-1.5 rounded-lg inline-block mb-2">JWD</div>
                <h2 class="text-2xl font-bold text-white">Owner Admin Login</h2>
                <p class="text-xs text-gray-400 mt-1">Enter password to manage inventory (Default: 123456)</p>
            </div>
            <div class="space-y-4">
                <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full bg-slate-900 border border-gray-700 rounded-xl p-3 text-sm outline-none focus:ring-2 focus:ring-amber-500 text-white">
                <button onclick="checkLogin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-xl transition">Login Dashboard</button>
                <div id="login-error" class="text-red-400 text-xs text-center hidden">Incorrect password!</div>
            </div>
        </div>
    </div>

    <!-- 主后台界面 -->
    <div id="admin-dashboard" class="hidden max-w-7xl mx-auto px-4 py-8 space-y-8">
        <div class="flex justify-between items-center border-b border-gray-800 pb-6">
            <div>
                <h1 class="text-3xl font-extrabold text-white">JWD Autoworld Management</h1>
                <p class="text-xs text-gray-400">Add, sell, or remove vehicles instantly synced with live site</p>
            </div>
            <a href="index.html" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-amber-400 px-4 py-2 rounded-xl text-xs font-bold transition border border-gray-700">
                <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> View Live Site
            </a>
        </div>

        <!-- 添加新车表单 -->
        <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-gray-700 shadow-xl space-y-6">
            <h2 class="text-xl font-bold text-amber-400 flex items-center">
                <i class="fa-solid fa-car-plus mr-2"></i> Publish New Car
            </h2>
            <form id="add-car-form" onsubmit="handlePublishCar(event)" class="space-y-4">
                <div class="grid sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Car Name & Model *</label>
                        <input type="text" id="c-name" required placeholder="e.g. Perodua Bezza 1.3 AV" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Make / Brand *</label>
                        <select id="c-make" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="Perodua">Perodua</option>
                            <option value="Proton">Proton</option>
                            <option value="Honda">Honda</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Subaru">Subaru</option>
                            <option value="Other">Other Brand</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Body Type *</label>
                        <select id="c-body" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="Sedan">Sedan</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="SUV">SUV</option>
                            <option value="MPV">MPV</option>
                        </select>
                    </div>
                </div>

                <div class="grid sm:grid-cols-4 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Year *</label>
                        <input type="number" id="c-year" required placeholder="2023" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Selling Price (Number or Text) *</label>
                        <input type="text" id="c-price" required placeholder="e.g. 34800 or Ask for Price" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Est. Monthly (RM)</label>
                        <input type="number" id="c-monthly" placeholder="464 (Leave blank if none)" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Mileage *</label>
                        <input type="text" id="c-mileage" required placeholder="75,222 km" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <div class="grid sm:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Transmission</label>
                        <input type="text" id="c-trans" value="Automatic" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Engine</label>
                        <input type="text" id="c-engine" value="1.3L Dual VVT-i" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-300 mb-1">Badge / Highlight</label>
                        <input type="text" id="c-badge" value="Warranty Until 2028" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-white outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-300 mb-1">Upload Car Photos (Select multiple photos from phone/PC)</label>
                    <input type="file" id="c-files" multiple accept="image/*" class="w-full bg-slate-900 border border-gray-700 rounded-lg p-2.5 text-sm text-gray-300 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-600 cursor-pointer">
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-extrabold py-3.5 rounded-xl shadow transition flex items-center justify-center">
                    <i class="fa-solid fa-cloud-arrow-up mr-2"></i> Upload Photos & Publish Car
                </button>
            </form>
        </div>

        <!-- 库存列表管理 -->
        <div class="bg-slate-800 p-6 sm:p-8 rounded-2xl border border-gray-700 shadow-xl space-y-4">
            <h2 class="text-xl font-bold text-white"><i class="fa-solid fa-warehouse mr-2 text-amber-500"></i> Manage Inventory Stock</h2>
            <div id="admin-car-list" class="space-y-3"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://qokodjjnjtjkihrnnwyw.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_FcWUXzF-TJVVIecbTXpAmA_3ET8b2q-';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const ADMIN_PIN = '123456';

        // 智能格式化价格显示（数字自动加 RM 和千分位，文字原样显示）
        function formatPrice(val) {
            if (!val) return 'Ask for Price';
            const num = Number(String(val).replace(/,/g, '').trim());
            return !isNaN(num) && String(val).trim() !== '' ? `RM ${num.toLocaleString()}` : val;
        }

        function checkLogin() {
            const pass = document.getElementById('admin-pass').value;
            if (pass === ADMIN_PIN) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadAdminCars();
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        document.getElementById('admin-pass').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') checkLogin();
        });

        async function loadAdminCars() {
            const container = document.getElementById('admin-car-list');
            container.innerHTML = `<div class="text-center py-6 text-gray-400">Loading inventory...</div>`;

            const { data, error } = await supabaseClient.from('cars').select('*').order('id', { ascending: false });
            if (error) {
                container.innerHTML = `<div class="text-red-400 text-sm">Error loading cars: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-gray-500">No cars in database yet. Use the form above to add one.</div>`;
                return;
            }

            container.innerHTML = data.map(car => `
                <div class="bg-slate-900 p-4 rounded-xl border border-gray-700 flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center space-x-4 w-full sm:w-auto">
                        <img src="${car.Images && car.Images[0] ? car.Images[0] : 'https://placehold.co/100x70'}" class="w-20 h-14 object-cover rounded-lg flex-shrink-0">
                        <div>
                            <h3 class="font-bold text-white">${car.name}</h3>
                            <div class="text-xs text-gray-400">${formatPrice(car.price)} · ${car.year} · ${car.mileage}</div>
                            <span class="inline-block mt-1 px-2 py-0.5 rounded text-[10px] font-bold ${car.status === 'sold' ? 'bg-red-500/20 text-red-400' : 'bg-green-500/20 text-green-400'}">${car.status === 'sold' ? 'SOLD / 下架' : 'AVAILABLE / 在售'}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                        <button onclick="toggleStatus(${car.id}, '${car.status}')" class="px-3 py-2 rounded-lg text-xs font-bold ${car.status === 'sold' ? 'bg-green-600 hover:bg-green-700 text-white' : 'bg-amber-500 hover:bg-amber-600 text-slate-900'} transition">
                            ${car.status === 'sold' ? 'Re-publish' : 'Mark as Sold'}
                        </button>
                        <button onclick="deleteCar(${car.id})" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white px-3 py-2 rounded-lg text-xs font-bold transition">
                            Delete
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function handlePublishCar(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.innerText = 'Uploading images to Cloud...';

            const fileInput = document.getElementById('c-files');
            const files = fileInput.files;
            let imageUrls = [];

            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileName = `${Date.now()}-${i}-${file.name.replace(/[^a-zA-Z0-9.]/g, '')}`;
                    const { error } = await supabaseClient.storage.from('car-photos').upload(fileName, file);
                    if (error) throw error;

                    const { data: publicURL } = supabaseClient.storage.from('car-photos').getPublicUrl(fileName);
                    imageUrls.push(publicURL.publicUrl);
                }

                if (imageUrls.length === 0) {
                    imageUrls = ['https://images.unsplash.com/photo-1563720223185-11003d516935?auto=format&fit=crop&q=80&w=800'];
                }

                btn.innerText = 'Saving car to database...';

                const make = document.getElementById('c-make').value;
                const autoTag = (make === 'Perodua' || make === 'Proton') ? 'Local' : 'Japanese';

                const newCar = {
                    name: document.getElementById('c-name').value,
                    make: make,
                    body: document.getElementById('c-body').value,
                    year: parseInt(document.getElementById('c-year').value),
                    price: document.getElementById('c-price').value.trim(), // 支持数字或文字
                    monthly: parseInt(document.getElementById('c-monthly').value) || 0,
                    mileage: document.getElementById('c-mileage').value,
                    transmission: document.getElementById('c-trans').value,
                    engine: document.getElementById('c-engine').value,
                    badge: document.getElementById('c-badge').value,
                    tag: autoTag,
                    Images: imageUrls,
                    features: ["100% PUSPAKOM Certified & Verified Non-Accident", "Clean Interior & Smooth Engine Performance", "Full Service Record Available", "Fast Bank Loan Approval within 3 Working Days"],
                    status: 'available'
                };

                const { error: dbError } = await supabaseClient.from('cars').insert([newCar]);
                if (dbError) throw dbError;

                alert('Car published successfully!');
                document.getElementById('add-car-form').reset();
                loadAdminCars();
            } catch (err) {
                alert('Failed: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = 'Upload Photos & Publish Car';
            }
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'sold' ? 'available' : 'sold';
            const { error } = await supabaseClient.from('cars').update({ status: newStatus }).eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminCars();
        }

        async function deleteCar(id) {
            if (!confirm('Are you sure you want to delete this car permanently?')) return;
            const { error } = await supabaseClient.from('cars').delete().eq('id', id);
            if (error) alert('Error: ' + error.message);
            else loadAdminCars();
        }
    </script>
</body>
</html>
