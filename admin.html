<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWD Autoworld - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- 登录遮罩层 -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
        <div class="bg-white p-6 rounded-2xl max-w-sm w-full shadow-2xl space-y-4">
            <h2 class="text-xl font-bold text-navy-900 text-center"><i class="fa-solid fa-lock text-amber-500 mr-2"></i>Owner Login</h2>
            <p class="text-xs text-gray-500 text-center">请输入后台管理密码</p>
            <input type="password" id="admin-pwd" placeholder="Enter Password" class="w-full border rounded-lg p-3 text-sm outline-none focus:ring-2 focus:ring-amber-500">
            <button onclick="checkLogin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold py-3 rounded-lg transition">Login</button>
        </div>
    </div>

    <!-- 主后台界面 -->
    <div id="admin-panel" class="hidden max-w-4xl mx-auto p-4 sm:p-6 space-y-8 pb-16">
        <div class="flex justify-between items-center bg-slate-900 text-white p-6 rounded-2xl shadow">
            <div>
                <h1 class="text-2xl font-extrabold">JWD Autoworld 后台管理</h1>
                <p class="text-xs text-gray-400 mt-1">在这里发布、下架车辆，数据将实时同步至前台</p>
            </div>
            <a href="index.html" target="_blank" class="bg-amber-500 text-slate-900 font-bold px-4 py-2 rounded-lg text-xs hover:bg-amber-400 transition">访问前台网站</a>
        </div>

        <!-- 发布新车表单 -->
        <div class="bg-white p-6 rounded-2xl shadow border border-gray-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4"><i class="fa-solid fa-circle-plus text-amber-500 mr-2"></i>上架新车</h2>
            <form id="add-car-form" onsubmit="uploadCar(event)" class="space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">车辆全称 (Name) *</label>
                        <input type="text" id="c-name" required placeholder="e.g. Perodua Bezza 1.3 AV" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">品牌 (Make) *</label>
                        <select id="c-make" class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-amber-500">
                            <option value="Perodua">Perodua</option>
                            <option value="Proton">Proton</option>
                            <option value="Honda">Honda</option>
                            <option value="Toyota">Toyota</option>
                            <option value="Subaru">Subaru</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">车型 (Body Type) *</label>
                        <select id="c-body" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Hatchback">Hatchback</option>
                            <option value="MPV">MPV</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">车辆分类标签 (Tag) *</label>
                        <select id="c-tag" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                            <option value="Local">Local (Proton/Perodua)</option>
                            <option value="Japanese">Japanese (Honda/Toyota/Subaru)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">年份 (Year) *</label>
                        <input type="number" id="c-year" required placeholder="2023" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">售价 (RM Price) *</label>
                        <input type="number" id="c-price" required placeholder="34800" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">里程 (Mileage)</label>
                        <input type="text" id="c-mileage" placeholder="75,222 km" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">变速箱 (Transmission)</label>
                        <input type="text" id="c-trans" value="Automatic" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">引擎排量 (Engine)</label>
                        <input type="text" id="c-engine" placeholder="1.3L Dual VVT-i" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">标语徽章 (Badge)</label>
                        <input type="text" id="c-badge" value="Warranty Until 2028" class="w-full border rounded-lg p-2.5 text-sm outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">车辆亮点 (每行一条 Features)</label>
                    <textarea id="c-features" rows="3" class="w-full border rounded-lg p-2.5 text-sm outline-none" placeholder="1 Careful Owner&#10;100% Accident Free&#10;Push Start"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-700 mb-1">选择车辆实拍照片 (可多选 6~10张) *</label>
                    <input type="file" id="c-files" multiple accept="image/*" class="w-full border rounded-lg p-2 text-sm bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-500 file:text-slate-900 hover:file:bg-amber-600">
                    <p class="text-[11px] text-gray-400 mt-1">第一张照片将自动作为封面图。</p>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold py-3.5 rounded-lg shadow transition">
                    确认上传并上架新车
                </button>
            </form>
        </div>

        <!-- 现有车辆库存管理 -->
        <div class="bg-white p-6 rounded-2xl shadow border border-gray-200 space-y-4">
            <h2 class="text-lg font-bold text-slate-900"><i class="fa-solid fa-car text-amber-500 mr-2"></i>库存车辆管理</h2>
            <div id="admin-car-list" class="space-y-3">
                <!-- 动态加载 -->
            </div>
        </div>
    </div>

    <script>
        // ================= 配置你的 Supabase 密钥 =================
        const SUPABASE_URL = "https://qokodjjnjtjkihrnnwyw.supabase.co";
        const SUPABASE_ANON_KEY = "填入你的_sb_publishable_...密钥"; 
        // ========================================================

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const ADMIN_PASSWORD = "123456"; // 可根据需要修改你的后台登录密码

        function checkLogin() {
            const pwd = document.getElementById('admin-pwd').value;
            if (pwd === ADMIN_PASSWORD) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                loadAdminCars();
            } else {
                alert('密码错误！');
            }
        }

        async function uploadCar(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "正在上传图片至云端，请稍候...";
            btn.disabled = true;

            const files = document.getElementById('c-files').files;
            if (files.length === 0) {
                alert('请至少选择一张照片！');
                btn.innerText = "确认上传并上架新车";
                btn.disabled = false;
                return;
            }

            let imageUrls = [];
            try {
                for (let i = 0; i < files.length; i++) {
                    const file = files[i];
                    const fileName = `${Date.now()}_${i}_${file.name.replace(/\s+/g, '_')}`;
                    const { data, error } = await supabaseClient.storage
                        .from('car-photos')
                        .upload(fileName, file);

                    if (error) throw error;

                    const { data: publicUrlData } = supabaseClient.storage
                        .from('car-photos')
                        .getPublicUrl(fileName);

                    imageUrls.push(publicUrlData.publicUrl);
                }

                const rawFeatures = document.getElementById('c-features').value;
                const featuresArr = rawFeatures ? rawFeatures.split('\n').filter(f => f.trim() !== '') : ["100% PUSPAKOM Certified", "Smooth Engine Performance"];

                const newCar = {
                    name: document.getElementById('c-name').value,
                    make: document.getElementById('c-make').value,
                    body: document.getElementById('c-body').value,
                    tag: document.getElementById('c-tag').value,
                    year: parseInt(document.getElementById('c-year').value),
                    price: parseInt(document.getElementById('c-price').value),
                    mileage: document.getElementById('c-mileage').value || "New Arrival",
                    transmission: document.getElementById('c-trans').value,
                    engine: document.getElementById('c-engine').value,
                    badge: document.getElementById('c-badge').value,
                    monthly: Math.round((parseInt(document.getElementById('c-price').value) * 0.9 * 0.035 * 7 + parseInt(document.getElementById('c-price').value) * 0.9) / (7 * 12)),
                    Images: imageUrls, // 对应你建的大写 Images 字段
                    features: featuresArr,
                    status: 'available'
                };

                const { error: dbError } = await supabaseClient.from('cars').insert([newCar]);
                if (dbError) throw dbError;

                alert('车辆上架成功！前台已实时更新。');
                document.getElementById('add-car-form').reset();
                loadAdminCars();
            } catch (err) {
                alert('上传失败: ' + err.message);
            } finally {
                btn.innerText = "确认上传并上架新车";
                btn.disabled = false;
            }
        }

        async function loadAdminCars() {
            const { data, error } = await supabaseClient.from('cars').select('*').order('created_at', { ascending: false });
            const listContainer = document.getElementById('admin-car-list');
            if (error) {
                listContainer.innerHTML = `<p class="text-red-500 text-xs">加载失败: ${error.message}</p>`;
                return;
            }

            if (data.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-400 text-xs text-center py-4">暂无车辆库存</p>`;
                return;
            }

            listContainer.innerHTML = data.map(car => `
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-100 gap-4">
                    <img src="${car.Images && car.Images[0] ? car.Images[0] : 'https://placehold.co/100'}" class="w-16 h-12 object-cover rounded-lg">
                    <div class="flex-1 min-w-0">
                        <div class="font-bold text-slate-900 text-sm truncate">${car.name}</div>
                        <div class="text-xs text-gray-500">RM ${car.price?.toLocaleString()} · ${car.year} · 状态: <span class="${car.status === 'available' ? 'text-green-600 font-bold' : 'text-red-500 font-bold'}">${car.status}</span></div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="toggleStatus('${car.id}', '${car.status}')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${car.status === 'available' ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-green-100 text-green-800 hover:bg-green-200'}">
                            ${car.status === 'available' ? '设为已售/下架' : '重新上架'}
                        </button>
                        <button onclick="deleteCar('${car.id}')" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-200">删除</button>
                    </div>
                </div>
            `).join('');
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'available' ? 'sold' : 'available';
            await supabaseClient.from('cars').update({ status: newStatus }).eq('id', id);
            loadAdminCars();
        }

        async function deleteCar(id) {
            if (confirm('确定要永久删除这辆车吗？')) {
                await supabaseClient.from('cars').delete().eq('id', id);
                loadAdminCars();
            }
        }
    </script>
</body>
</html>
